name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: dotnet test tests/socialmediaapi.Tests.csproj --configuration Release --nologo
      - name: Check vulnerable NuGet packages
        run: dotnet restore tests/socialmediaapi.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=critical -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1900%3BNU1904 --nologo

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/krypton
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm run test:e2e
      - name: Check vulnerable npm packages
        run: npm audit --audit-level=critical
